<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="container mt-5" style="max-width: 700px;">

        <!-- Шапка -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Мои задачи</h1>
            <div>
                <span class="me-3">Привет, {{ current_user.username }}!</span>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary btn-sm">Выйти</a>
            </div>
        </div>

        <!-- Форма добавления -->
        <form class="mb-4" id="add-form">
            <div class="input-group">
                <input type="text" id="task-input" class="form-control" placeholder="Что нужно сделать?">
                <button class="btn btn-primary" type="submit" id="add-btn">Добавить</button>
            </div>
        </form>

        <!-- Список задач -->
        <ul class="list-group" id="task-list">
            {% for task in tasks %}
                <li class="list-group-item d-flex align-items-center gap-2" data-id="{{ task.id }}">
                    <button class="btn btn-sm toggle-btn {% if task.done %}btn-success{% else %}btn-outline-secondary{% endif %}">
                        {% if task.done %}✅{% else %}⬜{% endif %}
                    </button>
                    <span class="task-text flex-grow-1 {% if task.done %}text-decoration-line-through text-muted{% endif %}">
                        {{ task.text }}
                    </span>
                    <button class="btn btn-sm btn-outline-danger delete-btn">✕</button>
                </li>
            {% endfor %}
        </ul>

        {% if not tasks %}
            <p class="text-muted" id="empty-msg">Пока задач нет</p>
        {% endif %}

    </div>

    <!-- Полоса статистики внизу -->
    <div class="stats-bar">
        <div class="container" style="max-width: 700px;">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span>Всего: <b id="stat-total">0</b></span>
                <span>✅ Выполнено: <b id="stat-completed">0</b> (<span id="stat-rate">0</span>%)</span>
                <span>⬜ Осталось: <b id="stat-active">0</b></span>
            </div>
            <div class="progress mt-2" style="height: 8px;">
                <div id="stat-progress" class="progress-bar bg-success" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
