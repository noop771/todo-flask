<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 700px;">

        <!-- Шапка -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Мои задачи</h1>
            <div>
                <span class="me-3">Привет, {{ current_user.username }}!</span>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary btn-sm">Выйти</a>
            </div>
        </div>

        <!-- Форма добавления -->
        <form class="mb-4" id="add-form">
            <div class="input-group">
                <input type="text" id="task-input" class="form-control" placeholder="Что нужно сделать?">
                <button class="btn btn-primary" type="submit" id="add-btn">Добавить</button>
            </div>
        </form>

        <!-- Список задач -->
        <ul class="list-group" id="task-list">
            {% for task in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center" data-id="{{ task.id }}">
                    <span class="task-text" style="cursor: pointer; {% if task.done %}text-decoration: line-through; color: gray;{% endif %}">
                        {{ task.text }}
                    </span>
                    <button class="btn btn-sm btn-outline-danger delete-btn">✕</button>
                </li>
            {% endfor %}
        </ul>

        {% if not tasks %}
            <p class="text-muted" id="empty-msg">Пока задач нет</p>
        {% endif %}

    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
