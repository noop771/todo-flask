<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 700px;">

        <!-- Шапка -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Мои задачи</h1>
            <div>
                <span class="me-3">Привет, {{ current_user.username }}!</span>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary btn-sm">Выйти</a>
            </div>
        </div>

        <!-- Форма добавления (пока не работает) -->
        <form class="mb-4">
            <div class="input-group">
                <input type="text" id="task-input" class="form-control" placeholder="Что нужно сделать?">
                <button class="btn btn-primary" type="button" id="add-btn">Добавить</button>
            </div>
        </form>

        <!-- Список задач -->
        {% if tasks %}
            <ul class="list-group">
                {% for task in tasks %}
                    <li class="list-group-item">
                        {{ task.text }}
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="text-muted">Пока задач нет. Добавь первую!</p>
        {% endif %}

    </div>
</body>
</html>
